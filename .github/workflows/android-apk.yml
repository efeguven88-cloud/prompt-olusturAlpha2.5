name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarini hazirla
        run: |
          mkdir -p www
          cp index.html www/index.html

      - run: npm install

      - name: Capacitor ayari
        run: |
          node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f));c.android=c.android||{};c.android.adjustMarginsForEdgeToEdge='disable';fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Android projesi
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Ekran ve klavye yamasi
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q windowSoftInputMode "$MAN" || sed -i '0,/<activity /s//<activity android:windowSoftInputMode="adjustResize" /' "$MAN"
          DIR=android/app/src/main/java/com/efe/promptolustur
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.java" <<'EOF'
          package com.efe.promptolustur;

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              if (Build.VERSION.SDK_INT >= 29) w.setNavigationBarContrastEnforced(false);
              applyBg(Color.parseColor("#121211"), false);
              View content = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                v.setPadding(bars.left, bars.top, bars.right, Math.max(bars.bottom, ime.bottom));
                return WindowInsetsCompat.CONSUMED;
              });
              getBridge().getWebView().addJavascriptInterface(new Bars(), "AndroidBars");
            }

            private void applyBg(int color, boolean lightBg) {
              Window w = getWindow();
              w.setBackgroundDrawable(new ColorDrawable(color));
              w.getDecorView().setBackgroundColor(color);
              View content = findViewById(android.R.id.content);
              if (content != null) content.setBackgroundColor(color);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
              c.setAppearanceLightStatusBars(lightBg);
              c.setAppearanceLightNavigationBars(lightBg);
            }

            private class Bars {
              @JavascriptInterface
              public void set(final String hex, final boolean light) {
                runOnUiThread(() -> {
                  try { applyBg(Color.parseColor(hex), light); } catch (Exception e) { }
                });
              }
            }
          }
          EOF

      - name: Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: prompt-olustur-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
